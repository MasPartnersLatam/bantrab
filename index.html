<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roadmap Bantrab × +Partners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F2F2EC; --card:#FFFFFF; --soft:#F7F7F3; --line:#D6D7D0; --line2:#EEEEE8;
  --ink:#111312; --ink2:#3A3F3C; --muted:#4A4F4C; --lime:#C8F031;
  --junta:#FCE9DE; --juntaInk:#B4400B; --alertInk:#8A2F05;
  --display:'Space Grotesk','Helvetica Neue',Helvetica,sans-serif;
  --body:'Manrope','Helvetica Neue',Helvetica,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
img{max-width:100%}
.wrap{max-width:1320px;margin:0 auto;padding:28px 20px 64px;display:flex;flex-direction:column;gap:24px}
.brandbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.logos{display:flex;align-items:center;gap:18px}
.logos .x{font-size:20px;color:#5A5F5C}
.titlebar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.eyebrow{margin:0;font-size:13px;font-weight:700;color:var(--muted)}
h1{margin:0;font-family:var(--display);font-size:clamp(30px,4vw,40px);line-height:1.1}
h2{margin:0;font-family:var(--display);font-size:24px}
h3{margin:0;font-size:16px}
.sub{margin:0;font-size:15px;color:var(--muted)}
.status{padding:12px 18px;border-radius:999px;font-size:14px;font-weight:700}
.status.ok{background:var(--ink);color:var(--lime)}
.status.late{background:var(--junta);color:var(--alertInk)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line);padding-bottom:14px}
.pill{min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--ink);background:var(--card);font-size:15px;font-weight:600}
.pill[aria-selected="true"]{background:var(--ink);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:16px}
.cardhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
.note{margin:0;font-size:14px;color:var(--muted)}
.grid{display:grid;gap:16px}
.g-auto280{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g-auto220{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.g-auto320{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g-auto240{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.hero{background:var(--ink);color:#fff;border-radius:16px;padding:32px;display:flex;flex-direction:column;gap:12px}
.hero .k{margin:0;font-size:13px;font-weight:700;color:var(--lime)}
.hero p.big{margin:0;font-family:var(--display);font-size:clamp(20px,2.4vw,26px);line-height:1.3;font-weight:600;max-width:60ch}
.tag{align-self:flex-start;padding:4px 12px;border-radius:999px;background:var(--line2);font-size:12px;font-weight:700}
.tag.lime{background:var(--lime)}
.project h3{font-size:19px}
.project p{margin:0;font-size:14px;line-height:1.5;color:var(--ink2)}
.project.main{border:2px solid var(--ink)}
.stage{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:12px;background:var(--soft)}
.stage .n{font-family:var(--display);font-size:13px;font-weight:700;color:var(--muted)}
.stage .name{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.04em}
.stage .t{font-size:13px;font-weight:700}
.stage p{margin:0;font-size:13px;line-height:1.45;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:13px;font-weight:600}
ul.plain{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.45}
/* Gantt */
.scroll{overflow-x:auto}
.gantt{min-width:1180px;display:flex;flex-direction:column}
.grow{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;gap:16px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line2)}
.ghead{align-items:end;padding:0 0 10px;border-bottom:1px solid #E4E5DF}
.colh{font-size:12px;font-weight:700;color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(9,minmax(0,1fr))}
.week{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600}
.week small{font-size:11px;font-weight:700;min-height:14px}
.week.junta{color:var(--juntaInk)}
.pname{font-family:var(--display);font-size:16px;font-weight:700;letter-spacing:.04em}
.prange{font-size:13px;color:var(--ink2)}
.pcad{font-size:12px;color:var(--muted)}
.track{position:relative;height:44px;background:var(--soft);border-radius:8px}
.track .jz{position:absolute;top:0;bottom:0;left:66.6667%;width:11.1111%;background:var(--junta)}
.track .today{position:absolute;top:0;bottom:0;left:0;width:2px;background:var(--ink)}
.bar{position:absolute;top:7px;height:30px;border:1px solid var(--ink);border-radius:6px;display:flex;align-items:center;padding:0 10px;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;transition:left .25s ease,width .25s ease,background .2s}
.ctrls{display:flex;gap:6px;align-items:center}
.ggroup{display:flex;justify-content:flex-start;align-items:center;gap:8px;margin-top:14px;padding:6px 0 6px;border-bottom:2px solid var(--ink)}
.ggroup .gt{font-family:var(--display);font-size:17px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
#tip{position:fixed;z-index:50;max-width:320px;background:var(--ink);color:#fff;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.45;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18);display:none}
#tip b{display:block;font-size:14px;margin-bottom:2px}
#tip .m{display:block;color:#CFD0CA;font-size:12px;margin-bottom:6px}
[data-tip]{cursor:help}
.bar:focus-visible,.diamond:focus-visible{outline:3px solid #2563EB;outline-offset:2px}
.diamond{position:absolute;top:13px;width:18px;height:18px;transform:rotate(45deg);border:1px solid var(--ink);border-radius:3px}
.ctrls select{height:44px;width:112px;padding:0 10px;border-radius:10px;border:1px solid #C9CAC3;background:#fff;font-size:14px;font-weight:600}
.ib{width:44px;height:44px;border-radius:10px;border:1px solid #C9CAC3;background:#fff;display:flex;align-items:center;justify-content:center}
.ib.alt{background:var(--soft)}
.legend{display:flex;flex-wrap:wrap;gap:10px 24px;font-size:13px;color:var(--ink2);align-items:center}
.legend label,.legend span{display:flex;align-items:center;gap:8px}
.legend input[type=color]{width:28px;height:28px;padding:0;border:1px solid var(--ink);border-radius:6px;background:none;cursor:pointer}
.sw{width:16px;height:16px;border-radius:4px}
/* lists */
ul.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.checks li{display:grid;grid-template-columns:44px minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:52px;border-bottom:1px solid var(--line2)}
ul.checks input{width:22px;height:22px;margin:0 auto;accent-color:var(--ink);cursor:pointer}
ul.checks label{font-size:15px;font-weight:600;cursor:pointer}
ul.checks li.done label{text-decoration:line-through;color:#5A5F5C}
.owner{padding:4px 12px;border-radius:999px;border:1px solid var(--ink);font-size:12px;font-weight:700}
.date{font-size:14px;font-weight:700;text-align:right;min-width:90px}
.date.fixed{color:var(--juntaInk)}
.progress{height:10px;border-radius:999px;background:var(--line2);overflow:hidden}
.progress div{height:100%;background:var(--ink);transition:width .3s}
/* docs */
.row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.side{flex:1 1 360px;min-width:0}
.mainc{flex:999 1 560px;min-width:0}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 20px;border:2px dashed #A9AAA3;border-radius:12px;background:var(--soft);text-align:center;cursor:pointer}
.drop strong{font-size:16px}
.drop span{font-size:13px;line-height:1.45;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.doc{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left;width:100%}
.doc[aria-pressed="true"]{border:2px solid var(--ink);background:var(--soft)}
.doc .dn{display:flex;flex-direction:column;gap:2px;min-width:0}
.doc .dn b{font-size:14px}
.doc .dn small{font-size:12px;color:var(--muted)}
.st{flex-shrink:0;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--line2)}
.st.ok{background:var(--lime)}
.box{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--soft)}
.box.warm{background:var(--junta)}
.box ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px;line-height:1.45}
.changes{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:12px;border:2px solid var(--ink)}
.change{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line2)}
.change b{font-size:15px}
.change span{font-size:13px;line-height:1.45;color:var(--ink2)}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--ink);font-size:14px;font-weight:700;background:var(--lime)}
.btn.dark{background:var(--ink);color:#fff}
.btn.done{background:var(--line2)}
.chat{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:12px;background:var(--soft)}
.q{align-self:flex-end;max-width:80%;padding:12px 16px;border-radius:14px;background:var(--ink);color:#fff;font-size:15px;line-height:1.45}
.a{align-self:flex-start;max-width:85%;display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:14px;background:#fff;border:1px solid var(--line)}
.a p{margin:0;font-size:15px;line-height:1.55}
.askrow{display:flex;flex-wrap:wrap;gap:10px}
.askrow input{flex:1 1 320px;min-width:0;height:48px;padding:0 16px;border-radius:12px;border:1px solid #A9AAA3;font-size:15px;background:#fff}
.next{background:var(--ink);color:#fff;border-radius:16px;padding:24px;display:flex;flex-direction:column;gap:10px}
.next .k{margin:0;font-size:13px;font-weight:700;color:var(--lime)}
.next .big{margin:0;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.25}
.next p{margin:0;font-size:14px;line-height:1.5;color:#E4E5DF}
.reset{min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
@media (max-width:640px){
  ul.checks li{grid-template-columns:44px minmax(0,1fr);row-gap:4px;padding:8px 0}
  ul.checks li .owner,ul.checks li .date{grid-column:2;justify-self:start;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.grow.wide{grid-template-columns:250px minmax(0,1fr) 322px}
.gantt.wide{min-width:1160px}
.plabel{display:flex;justify-content:space-between;align-items:center;gap:6px}
.ptext{display:flex;flex-direction:column;gap:3px;min-width:0}
.rowbtns{display:flex;gap:4px;flex-shrink:0}
.ib.sm{width:44px;height:44px;border-color:transparent;background:transparent}
.ib.sm:hover{border-color:#C9CAC3;background:#fff}
.eform{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:14px;border:2px solid var(--ink);border-radius:12px;background:var(--soft);margin:8px 0}
.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700;color:var(--muted)}
.fld input,.fld select{height:44px;padding:0 10px;border-radius:10px;border:1px solid #A9AAA3;background:#fff;font-size:14px;font-weight:500;color:var(--ink);min-width:130px}
.fld.grow2{flex:1 1 240px}.fld.grow2 input{width:100%}
.addrow{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;padding-top:14px}
.addbtn{align-self:flex-start;min-height:44px;padding:0 16px;border-radius:999px;border:1px dashed var(--ink);background:#fff;font-size:14px;font-weight:700;margin:8px 0 4px}
.src{padding:3px 8px;border-radius:999px;background:var(--line2);font-size:11px;font-weight:700;color:var(--ink2);white-space:nowrap}
ul.checks li.ms{grid-template-columns:44px minmax(0,1fr) auto 96px 92px}
ul.checks li.tk{grid-template-columns:44px minmax(0,1fr) auto auto 92px}
ul.checks li.editing{display:block;border-bottom:none}
ul.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ul.qs li{display:grid;grid-template-columns:minmax(0,1fr) 92px;gap:8px;align-items:center;min-height:48px;border-bottom:1px solid #F0D5C7;font-size:14px;line-height:1.45}
ul.qs li.editing{display:block}
.empty{margin:0;font-size:14px;color:var(--muted)}
@media (max-width:640px){
  ul.checks li.ms,ul.checks li.tk{grid-template-columns:44px minmax(0,1fr) 92px}
  ul.checks li.ms .owner,ul.checks li.ms .date,ul.checks li.tk .src,ul.checks li.tk .due{grid-column:2}
}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-direction:column;gap:20px">
    <div class="brandbar">
      <div class="logos">
        <img src="assets/logo-partners.png" alt="+Partners" style="height:26px;width:auto">
        <span class="x" aria-hidden="true">×</span>
        <img src="assets/logo-bantrab.png" alt="Bantrab" style="height:36px;width:auto">
      </div>
      <button type="button" class="reset" data-action="reset">Restablecer datos</button>
    </div>
    <div class="titlebar">
      <div style="display:flex;flex-direction:column;gap:6px">
        <p class="eyebrow">Revisión de la estrategia digital de Bantrab</p>
        <h1>Roadmap del proyecto</h1>
        <p class="sub">5 de octubre al 4 de diciembre de 2026, semana <span id="weekNum">1</span> de 9</p>
      </div>
      <div id="status" class="status" role="status"></div>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Secciones" id="tabs"></nav>

  <main id="view"></main>
  <div id="tip" role="tooltip"></div>
</div>

  function migrate(s) {
    if (!s.tracks || !s.tracks.length) s.tracks = DEFAULT_TRACKS.slice();

    return s;
  }

    } catch (e) {}
    return initialState();
  }
  function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {} }
  function commit() { save(); render(); }

  /* ---------- Utilidades ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function uid() { return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function inkFor(hex) {
    var h = (hex || '#000000').replace('#','');
    if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
    var n = parseInt(h, 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#111312' : '#FFFFFF';
  }
  function currentWeek() {
    var d = Math.floor((new Date() - START) / (7*24*3600*1000));
    return Math.max(0, Math.min(W - 1, d));

  function isEditing(kind, id) { return ui.edit && ui.edit.kind === kind && ui.edit.id === id; }

      fld('Empieza', '<select name="start">' + opts(MONDAYS.map(function (m, i) { return [i, 'Semana del ' + m]; }), p.start) + '</select>') +
      (p.fixed ? fld('Fecha a mostrar', '<input name="note" value="' + esc(p.note || '') + '">')

    function phaseRow(p) {

      return '<button type="button" class="doc" data-action="doc" data-id="' + d.id + '" aria-pressed="' + (state.doc === d.id) + '">' +
        '<span class="dn"><b>' + esc(d.name) + '</b><small>' + d.kind + ', envía ' + d.from + '</small></span>' +
        '<span class="st' + (d.analyzed ? ' ok' : '') + '">' + (d.analyzed ? 'Analizado' : 'Pendiente') + '</span></button>';
    }).join('');
    var sd = DOCS.filter(function (d) { return d.id === state.doc; })[0] || DOCS[0];
    var analysis;
    if (sd.analyzed) {
      var qs = state.questions[sd.id] || [];
      var qItems = qs.map(function (q) {
        if (isEditing('q', q.id)) {
          return '<li class="editing"><form class="eform" data-form="q" data-id="' + q.id + '">' +
            fld('Pregunta', '<input name="text" required value="' + esc(q.text) + '">', true) + formBtns() + '</form></li>';
        }
        return '<li><span>' + esc(q.text) + '</span>' + rowBtns('q', q.id, 'la pregunta') + '</li>';
      }).join('');
      analysis = '<p style="margin:0;font-size:16px;line-height:1.55">' + esc(sd.summary) + '</p>' +
        '<div class="box"><h3 style="font-size:15px">Acuerdos</h3><ul>' + sd.agreements.map(function (a) { return '<li>' + esc(a) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="box warm"><h3 style="font-size:15px">Preguntas que surgen</h3>' +
          '<p class="note" style="color:var(--ink2)">Preguntas de +Partners sobre la estrategia, a partir de este material.</p>' +
          (qs.length ? '<ul class="qs">' + qItems + '</ul>' : '<p class="empty">Todavía no hay preguntas.</p>') +
          '<form class="addrow" data-form="qAdd">' + fld('Nueva pregunta', '<input name="text" required placeholder="Escribí la pregunta">', true) +
          '<button type="submit" class="btn">Agregar</button></form></div>';
    } else {
      analysis = '<div class="box" style="padding:24px;gap:12px"><p style="margin:0;font-size:16px;font-weight:700">Todavía no llegó</p>' +
        '<p style="margin:0;font-size:15px;line-height:1.5;color:var(--ink2)">' + esc(sd.expect) + '</p>' +
        '<p style="margin:0;font-size:14px;line-height:1.5;color:var(--muted)">Cuando se cargue, acá aparece el resumen, los acuerdos y las preguntas que surgen.</p></div>';
    }
    var ask = state.askIdx >= 0 ? PRESETS[state.askIdx] :
      {q:state.asked,a:'Todavía no hay un modelo conectado. Cuando lo conectemos, Claude va a responder acá a partir de todas las reuniones y documentos cargados.',src:'base de consultas'};
    var presets = PRESETS.map(function (p, i) {
      return '<button type="button" class="pill" style="background:' + (state.askIdx === i ? 'var(--lime)' : '#fff') + ';font-size:14px" data-action="preset" data-i="' + i + '">' + esc(p.q) + '</button>';
    }).join('');
    return '' +
    '<section style="display:flex;flex-direction:column;gap:24px"><div class="row">' +
      '<div class="card side"><h2>Reuniones y documentos</h2>' +
        '<label class="drop" for="doc-upload">' + ICON.upload + '<strong>Subir transcript o documento</strong>' +
        '<span>Se analiza al cargarlo, suma las preguntas que surgen y queda en la base de consultas.</span></label>' +
        '<input id="doc-upload" class="sr" type="file" data-action="upload">' +
        '<p id="uploadMsg" class="note" role="status"></p>' +
        '<div style="display:flex;flex-direction:column;gap:8px">' + list + '</div></div>' +
      '<div class="card mainc"><div style="display:flex;flex-direction:column;gap:6px"><p class="eyebrow">Análisis</p><h2>' + esc(sd.name) + '</h2></div>' + analysis + '</div>' +
    '</div>' +
    '<div class="card"><div class="cardhead"><h2>Preguntale al proyecto</h2><p class="note">Base de consultas: 1 transcript y 0 documentos. Cada respuesta cita su fuente.</p></div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:8px">' + presets + '</div>' +
      '<div class="chat"><div class="q">' + esc(ask.q) + '</div><div class="a"><p>' + esc(ask.a) + '</p><span class="tag lime">Fuente: ' + esc(ask.src) + '</span></div></div>' +
      '<form class="askrow" data-form="ask"><label class="sr" for="ask-input">Tu pregunta</label>' +
        '<input id="ask-input" type="text" placeholder="Ej.: ¿Qué dijo Cristhian sobre la nueva app?" autocomplete="off">' +
        '<button type="submit" class="btn dark" style="border-radius:12px;min-height:48px">Preguntar</button></form>' +
    '</div></section>';
  }

  function viewWeek(key) {
    var meta = WEEKMETA[key], list = state.tasks[key] || [];
    var done = list.filter(function (t) { return t.done; }).length;
    var pct = list.length ? Math.round(done / list.length * 100) : 0;
    var items = list.map(function (t) {
      if (isEditing('task', t.id)) {
        return '<li class="editing"><form class="eform" data-form="task" data-id="' + t.id + '" data-key="' + key + '">' +
          fld('Tarea', '<input name="name" required value="' + esc(t.name) + '">', true) +
          fld('Para cuándo', '<input name="due" value="' + esc(t.due) + '">') + formBtns() + '</form></li>';
      }
      return '<li class="tk' + (t.done ? ' done' : '') + '">' +
        '<input type="checkbox" id="task-' + t.id + '" data-action="task" data-key="' + key + '" data-id="' + t.id + '"' + (t.done ? ' checked' : '') + '>' +
        '<label for="task-' + t.id + '">' + esc(t.name) + '</label>' +
        '<span class="src">' + esc(t.src || 'Agregada') + '</span>' +
        '<span class="due" style="font-size:13px;font-weight:700;color:var(--ink2)">' + esc(t.due) + '</span>' +
        rowBtns('task', t.id, 'la tarea', ' data-key="' + key + '"') + '</li>';
    }).join('');
    return '' +
    '<section class="row">' +
      '<div class="card mainc"><div class="cardhead"><h2>' + meta.title + '</h2><p class="note">' + done + ' de ' + list.length + ' listos</p></div>' +
        '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div style="width:' + pct + '%"></div></div>' +
        (list.length ? '<ul class="checks">' + items + '</ul>' : '<p class="empty">No hay tareas cargadas.</p>') +
        '<form class="addrow" data-form="taskAdd" data-key="' + key + '">' +
          fld('Nueva tarea', '<input name="name" required placeholder="Ej.: Revisar el material de jóvenes">', true) +
          fld('Para cuándo', '<input name="due" placeholder="Ej.: Vie 9 oct">') +
          '<button type="submit" class="btn">Agregar tarea</button></form></div>' +
      '<div class="side" style="display:flex;flex-direction:column;gap:16px">' +
        '<div class="next"><p class="k">Próxima sesión</p><p class="big">Miércoles 7 de octubre, de 14 a 16 h (Guatemala)</p>' +
          '<p>Por Teams, a confirmar. Revisión de la estrategia: Bantrab nos cuenta la estrategia de ecosistema y de jóvenes, y empezamos por los assumptions de jóvenes.</p></div>' +
        '<div class="card"><h3>' + meta.sideTitle + '</h3><ul class="plain" style="font-size:14px">' + meta.side.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>' +
      '</div>' +
    '</section>';
  }

  /* ---------- Render ---------- */
  function render() {
    if (typeof tipEl !== 'undefined' && tipEl) hideTip();
    document.getElementById('weekNum').textContent = currentWeek() + 1;
    var st = document.getElementById('status'), msg = null;
    var prep = phase('eco-jun'), jv = phase('jov-aju');
    if (prep && prep.start + prep.dur - 1 > 5) msg = 'Atención: el paquete para la Junta queda después del 13/11';
    else if (jv && jv.start + jv.dur - 1 > 6) msg = 'Atención: las recomendaciones de jóvenes llegan después del lanzamiento';
    st.className = 'status ' + (msg ? 'late' : 'ok');
    st.textContent = msg || (prep ? 'En fecha: paquete para la Junta el ' + FRIDAYS[prep.start + prep.dur - 1] : 'En fecha');

    document.getElementById('tabs').innerHTML = TABS.map(function (t) {
      return '<button type="button" class="pill" role="tab" aria-selected="' + (state.view === t.id) + '" data-action="tab" data-id="' + t.id + '">' + t.label + '</button>';
    }).join('');

    var v = state.view, html;
    if (v === 'roadmap') html = viewRoadmap();
    else if (v === 'docs') html = viewDocs();
    else if (v === 'weekC' || v === 'weekP') html = viewWeek(v);
    else html = viewEnfoque();
    document.getElementById('view').innerHTML = html;

    if (ui.focus) {
      var el = document.querySelector(ui.focus);
      if (el) el.focus();
      ui.focus = null;
    }
  }

  /* ---------- Acciones ---------- */
  function move(id, ds, dd) {
    state.phases = state.phases.map(function (p) {
      if (p.id !== id) return p;
      var s = p.start + ds, d = p.dur + dd;
      if (d < 1 || s < 0 || s + d > W) return p;
      return Object.assign({}, p, {start:s, dur:d});
    });
    commit();
  }

  function del(kind, id, key) {
    if (kind === 'phase') {
      var p = phase(id);
      if (!p || !confirm('¿Borrar la etapa “' + p.name + '” y su hito?')) return;
      state.phases = state.phases.filter(function (x) { return x.id !== id; });
    } else if (kind === 'track') {
      var t = state.tracks.filter(function (x) { return x.id === id; })[0];
      if (!t) return;
      if (state.phases.some(function (x) { return x.track === id; })) { alert('El carril “' + t.label + '” todavía tiene etapas. Movelas a otro carril o borralas antes de borrar el carril.'); return; }
      if (!confirm('¿Borrar el carril “' + t.label + '”?')) return;
      state.tracks = state.tracks.filter(function (x) { return x.id !== id; });
    } else if (kind === 'ms') {
      if (!confirm('¿Borrar este hito?')) return;
      if (id.indexOf('ph-') === 0) {
        var pid = id.slice(3);
        state.phases = state.phases.map(function (x) { return x.id === pid ? Object.assign({}, x, {hideMs:true}) : x; });
      } else {
        state.customMs = state.customMs.filter(function (x) { return x.id !== id; });
      }
    } else if (kind === 'task') {
      if (!confirm('¿Borrar esta tarea?')) return;
      state.tasks[key] = state.tasks[key].filter(function (x) { return x.id !== id; });
    } else if (kind === 'q') {
      if (!confirm('¿Borrar esta pregunta?')) return;
      state.questions[state.doc] = (state.questions[state.doc] || []).filter(function (x) { return x.id !== id; });
    }
    ui.edit = null;
    commit();
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-action]');
    if (!el || el.tagName === 'INPUT' || el.tagName === 'SELECT' || el.tagName === 'FORM') return;
    var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    if (a === 'tab') { ui.edit = null; ui.adding = null; state.view = id; commit(); }
    else if (a === 'move') move(id, +el.getAttribute('data-ds'), +el.getAttribute('data-dd'));
    else if (a === 'doc') { ui.edit = null; state.doc = id; commit(); }
    else if (a === 'preset') { state.askIdx = +el.getAttribute('data-i'); state.asked = ''; commit(); }
    else if (a === 'edit') { ui.edit = {kind:el.getAttribute('data-kind'), id:id}; ui.adding = null; ui.focus = '.eform input'; render(); }
    else if (a === 'del') del(el.getAttribute('data-kind'), id, el.getAttribute('data-key'));
    else if (a === 'cancel') { ui.edit = null; ui.adding = null; render(); }
    else if (a === 'addTrack') { ui.adding = 'track'; ui.edit = null; ui.focus = '.eform input'; render(); }
    else if (a === 'addPhase') { ui.adding = 'phase:' + el.getAttribute('data-track'); ui.edit = null; ui.focus = '.eform input'; render(); }
    else if (a === 'reset') {
      if (confirm('¿Restablecer todo (cronograma, hitos, tareas y preguntas) a como estaba al inicio? Se pierden los cambios.')) { state = initialState(); ui.edit = null; ui.adding = null; commit(); }
    }
  });

  document.addEventListener('change', function (e) {
    var el = e.target, a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    if (a === 'owner') { state.phases = state.phases.map(function (p) { return p.id === id ? Object.assign({}, p, {owner:el.value}) : p; }); commit(); }
    else if (a === 'color') { state.colors[el.getAttribute('data-owner')] = el.value; commit(); }
    else if (a === 'ms') { state.done[id] = el.checked; commit(); }
    else if (a === 'task') {
      var key = el.getAttribute('data-key');
      state.tasks[key] = state.tasks[key].map(function (t) { return t.id === id ? Object.assign({}, t, {done:el.checked}) : t; });
      commit();
    }
    else if (a === 'upload') {
      var f = el.files && el.files[0], msg = document.getElementById('uploadMsg');
      if (f && msg) msg.textContent = 'Recibimos “' + f.name + '”. El análisis automático se activa cuando conectemos el modelo.';
    }
  });

  document.addEventListener('submit', function (e) {
    var form = e.target, kind = form.getAttribute('data-form');
    if (!kind) return;
    e.preventDefault();
    var fd = new FormData(form);
    function v(n) { return (fd.get(n) || '').toString().trim(); }
    var id = form.getAttribute('data-id'), key = form.getAttribute('data-key');

    if (kind === 'ask') {
      var q = (form.querySelector('input').value || '').trim();
      if (q) { state.askIdx = -1; state.asked = q; commit(); }
      return;
    }
    if (kind === 'phase') {
      var name = v('name'); if (!name) return;
      var start = Math.max(0, Math.min(W - 1, parseInt(v('start'), 10) || 0));
      var existing = id ? phase(id) : null;
      var dur = existing && existing.fixed ? existing.dur : Math.max(1, Math.min(W - start, parseInt(v('dur'), 10) || 1));
      var data = {name:name, track:v('track'), owner:v('owner'), start:start, dur:dur, ms:v('ms'), hideMs:!v('ms'), desc:v('desc')};
      if (existing && existing.fixed) data.note = v('note');
      if (existing) state.phases = state.phases.map(function (p) { return p.id === id ? Object.assign({}, p, data) : p; });
      else state.phases.push(Object.assign({id:uid()}, data));
    }
    else if (kind === 'ms') {
      if (!v('name')) return;
      if (id.indexOf('ph-') === 0) {
        var pid = id.slice(3);
        state.phases = state.phases.map(function (p) { return p.id === pid ? Object.assign({}, p, {ms:v('name'), hideMs:false}) : p; });
      } else {
        state.customMs = state.customMs.map(function (m) { return m.id === id ? Object.assign({}, m, {name:v('name'), owner:v('owner'), week:parseInt(v('week'), 10)}) : m; });
      }
    }
    else if (kind === 'track') {
      if (!v('label')) return;
      state.tracks = state.tracks.map(function (t) { return t.id === id ? Object.assign({}, t, {label:v('label')}) : t; });
    }
    else if (kind === 'trackAdd') {
      if (!v('label')) return;
      state.tracks = state.tracks.concat([{id:uid(), label:v('label')}]);
    }
    else if (kind === 'msAdd') {
      if (!v('name')) return;
      state.customMs.push({id:uid(), name:v('name'), owner:v('owner'), week:parseInt(v('week'), 10)});
    }
    else if (kind === 'task') {
      if (!v('name')) return;
      state.tasks[key] = state.tasks[key].map(function (t) { return t.id === id ? Object.assign({}, t, {name:v('name'), due:v('due')}) : t; });
    }
    else if (kind === 'taskAdd') {
      if (!v('name')) return;
      state.tasks[key] = (state.tasks[key] || []).concat([{id:uid(), name:v('name'), due:v('due'), src:'Agregada', done:false}]);
      ui.focus = 'form[data-form="taskAdd"] input';
    }
    else if (kind === 'q') {
      if (!v('text')) return;
      state.questions[state.doc] = state.questions[state.doc].map(function (q) { return q.id === id ? Object.assign({}, q, {text:v('text')}) : q; });
    }
    else if (kind === 'qAdd') {
      if (!v('text')) return;
      state.questions[state.doc] = (state.questions[state.doc] || []).concat([{id:uid(), text:v('text')}]);
      ui.focus = 'form[data-form="qAdd"] input';
    }
    ui.edit = null; ui.adding = null;
    commit();
  });

  /* ---------- Tooltip del cronograma ---------- */
  var tipEl = document.getElementById('tip'), tipFor = null;
  function showTip(target) {
    var p = phase(target.getAttribute('data-tip'));
    if (!p) return;
    var end = p.start + p.dur - 1;
    var when = p.fixed ? (p.note || MONDAYS[p.start]) : MONDAYS[p.start] + ' – ' + FRIDAYS[end];
    tipEl.innerHTML = '<b>' + esc(p.name) + '</b><span class="m">' + esc(trackLabel(p.track)) + ' · ' + esc(when) + ' · ' + esc(p.owner) + '</span>' +
      esc(p.desc || 'Sin descripción. Editá la etapa para agregarla.');
    tipEl.style.display = 'block';
    var r = target.getBoundingClientRect(), tw = tipEl.offsetWidth, th = tipEl.offsetHeight;
    var left = Math.min(Math.max(8, r.left), window.innerWidth - tw - 8);
    var top = r.bottom + 8;
    if (top + th > window.innerHeight - 8) top = r.top - th - 8;
    tipEl.style.left = left + 'px'; tipEl.style.top = top + 'px';
    tipFor = target;
    target.setAttribute('aria-describedby', 'tip');
  }
  function hideTip() {
    if (tipFor) tipFor.removeAttribute('aria-describedby');
    tipEl.style.display = 'none'; tipFor = null;
  }
  document.addEventListener('mouseover', function (e) {
    var t = e.target.closest('[data-tip]');
    if (t && t !== tipFor) showTip(t); else if (!t && tipFor) hideTip();
  });
  document.addEventListener('focusin', function (e) { var t = e.target.closest('[data-tip]'); if (t) showTip(t); else hideTip(); });
  document.addEventListener('focusout', hideTip);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideTip(); });
  window.addEventListener('scroll', hideTip, true);

  render();
})();
</script>
</body>
</html>
